<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>章屿の渡星屿</title>
    <link rel="stylesheet" href="css/style.css?v=202608011900">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">章屿の渡星屿</h1>
                <p class="subtitle">灵感素材创作系统</p>
            </div>
            <nav class="nav-menu" id="navMenu">
                <!-- Navigation items injected by JS -->
            </nav>
            <div class="sidebar-footer">
                <button class="btn-export" onclick="exportAllData()">导出全部数据</button>
                <button class="btn-import" onclick="document.getElementById('importFile').click()">导入数据</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllData(event)">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h2 class="page-title" id="pageTitle">控制台</h2>
                <div class="top-actions" id="topActions"></div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="js/schema.js?v=202608011900"></script>
    <script src="js/store.js?v=202608011900"></script>
    <script src="js/parser.js?v=202608011900"></script>
    <script src="js/characters.js?v=202608011900"></script>
    <script src="js/controller.js?v=202608011900"></script>
    <script src="js/inspiration.js?v=202608011900"></script>
    <script src="js/workshop.js?v=202608011900"></script>
    <script src="js/hotspot.js?v=202608011900"></script>
    <script src="js/app.js?v=202608011900"></script>
</body>
</html>
