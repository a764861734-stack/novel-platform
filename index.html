<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>章屿の渡星屿</title>
    <link rel="stylesheet" href="css/style.css?v=20260904081044">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">章屿の渡星屿</h1>
                <p class="subtitle">灵感素材创作系统</p>
            </div>
            <nav class="nav-menu" id="navMenu">
                <!-- Navigation items injected by JS -->
            </nav>
            <div class="sidebar-footer">
                <button class="btn-ai-assistant" onclick="AIAssistant.open()" id="aiAssistantBtn">🤖 AI 创作助手</button>

                <button class="btn-export" onclick="exportAllData()">导出全部数据</button>
                <button class="btn-import" onclick="document.getElementById('importFile').click()">导入数据</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllData(event)">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h2 class="page-title" id="pageTitle">控制台</h2>
                <div class="top-actions" id="topActions"></div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 每日工作台固定悬浮入口 -->
    <button class="fab-daily-workbench" onclick="GlobalControl.openDailyWorkbench()" title="每日工作台（拖动 reposition / 点击进入）">
        ⏰
        <span class="fab-label">每日工作台</span>
    </button>

    <!-- Scripts -->
    <script src="js/schema.js?v=20260904081044"></script>
    <script src="js/store.js?v=20260904081044"></script>
    <script src="js/parser.js?v=20260904081044"></script>
    <script src="js/characters.js?v=20260904081044"></script>
    <script src="js/controller.js?v=20260904081044"></script>
    <script src="js/inspiration.js?v=20260904081044"></script>
    <script src="js/workshop.js?v=20260904081044"></script>
    <script src="js/hotspot.js?v=20260904081044"></script>
    <script src="js/project-core.js?v=20260904081044"></script>

    <script src="js/project-overview.js?v=20260904081044"></script>
    <script src="js/global-control.js?v=20260904081044"></script>
    <script src="js/ai-service.js?v=20260904081044"></script>
    <script src="js/ai-assistant.js?v=20260904081044"></script>
    <script src="js/relationship-graph.js?v=20260904081044"></script>
    <script src="js/map-editor.js?v=20260904081044"></script>
    <script src="js/nested-outline.js?v=20260904081044"></script>
    <script src="js/project-characters.js?v=20260904081044"></script>
    <script src="js/project-foreshadowing.js?v=20260904081044"></script>
    <script src="js/project-chapters.js?v=20260904081044"></script>
    <script src="js/project-props.js?v=20260904081044"></script>
    <script src="js/project-revenue.js?v=20260904081044"></script>
    <script src="js/project-workbench.js?v=20260904081044"></script>
    <script src="js/calendar-engine.js?v=20260904081044"></script>
    <script src="js/event-manager.js?v=20260904081044"></script>
    <script src="js/timeline-explorer.js?v=20260904081044"></script>
    <script src="js/jjwxc-rankings.js?v=20260904081044"></script>
    <script src="js/project-locations.js?v=20260904081044"></script>
    <script src="js/project-integrations.js?v=20260904081044"></script>
    <script src="js/writing-center.js?v=20260904081044"></script>
    <script src="js/rhythm-checker.js?v=20260904081044"></script>
    <script src="js/material-enhance.js?v=20260904081044"></script>
    <script src="js/quality-center.js?v=20260904081044"></script>
    <script src="js/archive-library.js?v=20260904081044"></script>
    <script src="js/jinjiang-tools.js?v=20260904081044"></script>
    <script src="js/app.js?v=20260904081044"></script>
</body>
</html>
